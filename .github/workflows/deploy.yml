name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimum permissions required by the official Pages deployment actions.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build static site
        env:
          # base_url / base_path come from the repository's Pages settings, so
          # project sites, <owner>.github.io sites and custom domains all work.
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Verify static output
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/.nojekyll
          test -f out/work/index.html
          test -f out/contact/index.html
          echo "Static output OK: $(find out -type f | wc -l) files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
